<!doctype html>
<!-- @dsCard group="Spacing" name="Spacing · Motion" subtitle="0.15 / 0.2 s ease — no springs" viewport="700x200" -->
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 28px 24px; background: #fff; width: 700px; box-sizing: border-box; font-family: var(--font-primary); }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
  .col h4 { margin: 0 0 12px; font: 700 11px var(--font-primary); text-transform: uppercase; letter-spacing: 0.05em; color: #999; }
  .row { display: flex; align-items: center; gap: 12px; padding: 6px 0; font: 400 13px var(--font-primary); color: #161616; }
  .row .tok { font: 600 12px var(--font-primary); color: #161616; width: 130px; }
  .row .val { color: #999; font: 600 11px var(--font-primary); }
  .demo-btn { background:#00AA6C; color:#fff; padding:10px 16px; border-radius:8px; font:700 13px var(--font-primary); border:none; cursor:pointer; transition: background 0.15s ease; }
  .demo-btn:hover { background:#007A4D; }
  .demo-card { background:#fff; border:1px solid #DDD; border-radius:12px; padding:14px; box-shadow:0 1px 4px rgba(0,0,0,0.10); transition: box-shadow 0.2s ease; font:600 12px var(--font-primary); color:#161616; }
  .demo-card:hover { box-shadow:0 4px 16px rgba(0,0,0,0.16); }
</style></head>
<body>
  <div class="grid">
    <div class="col">
      <h4>Tokens</h4>
      <div class="row"><span class="tok">--transition-fast</span><span class="val">0.15s ease</span></div>
      <div class="row"><span class="tok">--transition-base</span><span class="val">0.2s ease</span></div>
      <div style="font:400 11px var(--font-primary);color:#999;margin-top:14px;line-height:1.5">No springs, no cubic-bezier. Subtle is the rule.</div>
    </div>
    <div class="col">
      <h4>Try it</h4>
      <div style="display:flex;flex-direction:column;gap:12px;align-items:flex-start">
        <button class="demo-btn">Hover me</button>
        <div class="demo-card">Hover this card — shadow only, no lift</div>
      </div>
    </div>
  </div>
</body></html>
