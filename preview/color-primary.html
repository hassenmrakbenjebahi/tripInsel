<!doctype html>
<!-- @dsCard group="Colors" name="Colors · Primary green" subtitle="Primary · hover · light · bright" viewport="700x200" -->
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 24px; background: #fff; width: 700px; box-sizing: border-box; font-family: var(--font-primary); }
  .row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
  .sw { border-radius: 12px; padding: 14px 14px 12px; border: 1px solid #DDD; min-height: 140px; display: flex; flex-direction: column; justify-content: space-between; }
  .sw .name { font: 700 13px/1.2 var(--font-primary); }
  .sw .hex { font: 600 11px/1 var(--font-primary); letter-spacing: 0.04em; opacity: 0.85; text-transform: uppercase; }
  .sw .desc { font: 400 11px/1.3 var(--font-primary); margin-top: 4px; opacity: 0.85; }
</style></head>
<body>
  <div class="row">
    <div class="sw" style="background:#00AA6C;color:#fff;border-color:transparent"><div><div class="name">Primary</div><div class="desc">Buttons, links, ratings</div></div><div class="hex">#00AA6C</div></div>
    <div class="sw" style="background:#007A4D;color:#fff;border-color:transparent"><div><div class="name">Primary hover</div><div class="desc">Hover · pressed</div></div><div class="hex">#007A4D</div></div>
    <div class="sw" style="background:#E6F7F1;color:#00703A"><div><div class="name">Primary light</div><div class="desc">Chip bg, accents</div></div><div class="hex">#E6F7F1</div></div>
    <div class="sw" style="background:#34E0A1;color:#003B23;border-color:transparent"><div><div class="name">Primary bright</div><div class="desc">Highlights, pins</div></div><div class="hex">#34E0A1</div></div>
  </div>
</body></html>
