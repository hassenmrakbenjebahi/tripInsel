<!doctype html>
<!-- @dsCard group="Type" name="Type · Semantic styles" subtitle="Price, score, button, badge, caption" viewport="700x360" -->
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 24px; background: #fff; width: 700px; box-sizing: border-box; font-family: var(--font-primary); }
  .group { padding: 8px 0; border-bottom: 1px solid #f0f0f0; display: flex; align-items: center; gap: 20px; }
  .group:last-child { border-bottom: 0; }
  .label { font: 600 11px var(--font-primary); color: #999; text-transform: uppercase; letter-spacing: 0.05em; width: 130px; flex-shrink: 0; }
</style></head>
<body>
  <div class="group"><div class="label">Price</div><span class="price">€45</span><span class="meta" style="color:#999">per person</span></div>
  <div class="group"><div class="label">Price large</div><span class="price-large">€ 1,240.50</span></div>
  <div class="group"><div class="label">Score large</div><span class="score-large">4.8</span><span class="meta">· 1,234 reviews</span></div>
  <div class="group"><div class="label">Button label</div><span class="button-label" style="background:#00AA6C;color:#fff;padding:10px 20px;border-radius:8px">Book on TripInsel</span></div>
  <div class="group"><div class="label">Badge label</div><span class="badge-label" style="background:#D4F5E9;color:#00703A;padding:3px 10px;border-radius:9999px">CONFIRMED</span></div>
  <div class="group"><div class="label">Card title</div><span class="card-title">Sunset camel ride at Ras R'mel</span></div>
  <div class="group"><div class="label">Caption</div><span class="caption">Houmt Souk · 3 hours · Small group</span></div>
</body></html>
