<!doctype html>
<!-- @dsCard group="Brand" name="Brand · Logo lockups" subtitle="Wordmark, monogram, dark, primary fill" viewport="700x280" -->
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 24px; background: #fff; width: 700px; box-sizing: border-box; font-family: var(--font-primary); }
  .lockup { display: flex; flex-direction: column; gap: 16px; }
  .wm-large { font: 800 56px var(--font-primary); color: #00AA6C; letter-spacing: -0.025em; display: inline-flex; align-items: center; gap: 12px; }
  .wm-mark { width: 56px; height: 56px; position: relative; }
  .wm-mark .b1 { position:absolute; bottom:0; left:0; width: 40px; height: 40px; border-radius: 9999px; background: #00AA6C; }
  .wm-mark .b2 { position:absolute; top:0; right:0; width: 24px; height: 24px; border-radius: 9999px; background: #34E0A1; }
  .wm-row { display: flex; gap: 28px; align-items: center; padding: 14px 0; border-top: 1px solid #F2F2F2; }
  .wm-medium { font: 800 28px var(--font-primary); color: #00AA6C; letter-spacing: -0.02em; }
  .wm-dark { background:#161616; padding: 12px 16px; border-radius: 8px; font: 800 22px var(--font-primary); color: #fff; letter-spacing: -0.02em; }
  .tag { font: 400 14px var(--font-primary); color: #555; }
</style></head>
<body>
  <div class="lockup">
    <div>
      <div class="wm-large">
        <span class="wm-mark"><span class="b1"></span><span class="b2"></span></span>
        TripInsel
      </div>
      <div class="tag" style="margin-top:6px;margin-left:68px">Book Djerba's Best Experiences</div>
    </div>
    <div class="wm-row">
      <span class="wm-medium">TripInsel</span>
      <span class="wm-dark">TripInsel</span>
      <span style="background:#00AA6C;padding:10px 14px;border-radius:8px;font:800 18px var(--font-primary);color:#fff;letter-spacing:-0.02em">TripInsel</span>
    </div>
  </div>
</body></html>
