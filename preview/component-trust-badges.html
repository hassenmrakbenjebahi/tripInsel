<!doctype html>
<!-- @dsCard group="Components" name="Components · Trust badges" subtitle="Travelers' Choice · Verified · Ranking" viewport="700x200" -->
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 28px 24px; background: #fff; width: 700px; box-sizing: border-box; font-family: var(--font-primary); }
  .group { margin-bottom: 18px; }
  .group:last-child { margin-bottom: 0; }
  .label { font: 700 10px var(--font-primary); text-transform: uppercase; letter-spacing: 0.05em; color: #999; margin-bottom: 10px; }
  .tc { display:inline-flex; align-items:center; gap:8px; background:#00AA6C; color:#fff; font:700 12px var(--font-primary); padding:8px 14px; border-radius:9999px; }
  .tc-lg { font-size: 14px; padding: 10px 18px; }
  .verified { display:inline-flex; align-items:center; gap:6px; background:#fff; color:#00AA6C; border:1px solid #00AA6C; font:700 11px var(--font-primary); padding:5px 10px; border-radius:9999px; }
  .rank { display:inline-flex; align-items:center; gap:6px; background:#E6F7F1; color:#00703A; font:700 12px var(--font-primary); padding:5px 12px; border-radius:9999px; }
  .vbk { font: 400 11px var(--font-primary); color: #555; display: inline-flex; align-items: center; gap: 4px; }
</style></head>
<body>
  <div class="group"><div class="label">Travelers' Choice 2025 — top 10–15% only</div>
    <span class="tc"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="6"/><path d="m15.477 12.89 1.515 8.526a.5.5 0 0 1-.81.47l-3.58-2.687a1 1 0 0 0-1.197 0l-3.586 2.686a.5.5 0 0 1-.81-.469l1.514-8.526"/></svg>Travelers' Choice 2025</span>
    <span class="tc tc-lg" style="margin-left:8px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="6"/><path d="m15.477 12.89 1.515 8.526a.5.5 0 0 1-.81.47l-3.58-2.687a1 1 0 0 0-1.197 0l-3.586 2.686a.5.5 0 0 1-.81-.469l1.514-8.526"/></svg>Travelers' Choice 2025</span>
  </div>
  <div class="group"><div class="label">Verified business · Ranking · Verified booking</div>
    <span class="verified"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/></svg>Verified Business</span>
    <span class="rank" style="margin-left:8px">#1 of 87 in Djerba</span>
    <span class="vbk" style="margin-left:12px"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#555" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>Verified booking</span>
  </div>
</body></html>
