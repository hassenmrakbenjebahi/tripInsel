<!doctype html>
<!-- @dsCard group="Spacing" name="Spacing · Shadows" subtitle="Subtle 4-tier elevation" viewport="700x220" -->
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 32px 24px; background: #F2F2F2; width: 700px; box-sizing: border-box; font-family: var(--font-primary); }
  .row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 18px; }
  .cell { display: flex; flex-direction: column; align-items: flex-start; gap: 12px; }
  .card { width: 100%; height: 76px; background: #fff; border-radius: 12px; }
  .name { font: 700 12px var(--font-primary); color: #161616; }
  .val { font: 600 10px var(--font-primary); color: #999; margin-top: -4px; }
</style></head>
<body>
  <div class="row">
    <div class="cell"><div class="card" style="box-shadow:0 1px 4px rgba(0,0,0,0.10)"></div><div><div class="name">--shadow-sm / card</div><div class="val">0 1 4 · 10%</div></div></div>
    <div class="cell"><div class="card" style="box-shadow:0 2px 8px rgba(0,0,0,0.12)"></div><div><div class="name">--shadow-md</div><div class="val">0 2 8 · 12%</div></div></div>
    <div class="cell"><div class="card" style="box-shadow:0 4px 16px rgba(0,0,0,0.14)"></div><div><div class="name">--shadow-lg</div><div class="val">0 4 16 · 14%</div></div></div>
    <div class="cell"><div class="card" style="box-shadow:0 8px 24px rgba(0,0,0,0.14)"></div><div><div class="name">--shadow-dropdown</div><div class="val">0 8 24 · 14%</div></div></div>
  </div>
  <div style="font:400 11px var(--font-primary);color:#999;margin-top:20px;line-height:1.5">Card-hover swaps <strong style="color:#161616">--shadow-card</strong> → <strong style="color:#161616">--shadow-card-hover</strong> (0 4 16 · 16%). No translateY lift.</div>
</body></html>
