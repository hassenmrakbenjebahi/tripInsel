<!doctype html>
<!-- @dsCard group="Colors" name="Colors · Status" subtitle="Confirmed · pending · cancelled · completed" viewport="700x200" -->
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 24px; background: #fff; width: 700px; box-sizing: border-box; font-family: var(--font-primary); }
  .row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
  .sw { border-radius: 12px; padding: 16px 14px 12px; min-height: 130px; display: flex; flex-direction: column; justify-content: space-between; border: 1px solid #DDD; position: relative; overflow: hidden; }
  .sw .pill { font: 700 11px var(--font-primary); text-transform: uppercase; letter-spacing: 0.05em; padding: 4px 10px; border-radius: 9999px; align-self: flex-start; }
  .sw .name { font: 700 14px var(--font-primary); color: #161616; }
  .sw .hex { font: 600 11px/1 var(--font-primary); color: #999; letter-spacing: 0.04em; text-transform: uppercase; }
</style></head>
<body>
  <div class="row">
    <div class="sw"><span class="pill" style="background:#D4F5E9;color:#00703A">Confirmed</span><div><div class="name">Confirmed</div><div class="hex">#00AA6C · #D4F5E9</div></div></div>
    <div class="sw"><span class="pill" style="background:#FEF3C7;color:#8A6000">Pending</span><div><div class="name">Pending</div><div class="hex">#F2A00A · #FEF3C7</div></div></div>
    <div class="sw"><span class="pill" style="background:#FDE8E8;color:#A30000">Cancelled</span><div><div class="name">Cancelled</div><div class="hex">#D93025 · #FDE8E8</div></div></div>
    <div class="sw"><span class="pill" style="background:#F2F2F2;color:#555">Completed</span><div><div class="name">Completed</div><div class="hex">#555555 · #F2F2F2</div></div></div>
  </div>
</body></html>
