<!doctype html>
<!-- @dsCard group="Colors" name="Colors · Activity categories" subtitle="10 chip accents — chip backgrounds only" viewport="700x240" -->
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 24px; background: #fff; width: 700px; box-sizing: border-box; font-family: var(--font-primary); }
  .row { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; }
  .sw { border-radius: 10px; padding: 12px 10px; min-height: 96px; display: flex; flex-direction: column; justify-content: space-between; border: 1px solid #DDD; }
  .dot { width: 24px; height: 24px; border-radius: 9999px; }
  .name { font: 700 12px/1.2 var(--font-primary); color: #161616; }
  .hex { font: 600 10px var(--font-primary); color: #999; text-transform: uppercase; letter-spacing: 0.03em; }
</style></head>
<body>
  <div class="row" style="margin-bottom:10px">
    <div class="sw"><div class="dot" style="background:#C9853D"></div><div><div class="name">Desert</div><div class="hex">#C9853D</div></div></div>
    <div class="sw"><div class="dot" style="background:#2E91D6"></div><div><div class="name">Water sports</div><div class="hex">#2E91D6</div></div></div>
    <div class="sw"><div class="dot" style="background:#5A4FCF"></div><div><div class="name">Cultural</div><div class="hex">#5A4FCF</div></div></div>
    <div class="sw"><div class="dot" style="background:#E07A3B"></div><div><div class="name">Cooking</div><div class="hex">#E07A3B</div></div></div>
    <div class="sw"><div class="dot" style="background:#1FA7B8"></div><div><div class="name">Diving</div><div class="hex">#1FA7B8</div></div></div>
  </div>
  <div class="row">
    <div class="sw"><div class="dot" style="background:#00AA6C"></div><div><div class="name">Boat</div><div class="hex">#00AA6C</div></div></div>
    <div class="sw"><div class="dot" style="background:#8B5A3C"></div><div><div class="name">Quad</div><div class="hex">#8B5A3C</div></div></div>
    <div class="sw"><div class="dot" style="background:#A06A4C"></div><div><div class="name">Horse</div><div class="hex">#A06A4C</div></div></div>
    <div class="sw"><div class="dot" style="background:#D66C8E"></div><div><div class="name">Spa</div><div class="hex">#D66C8E</div></div></div>
    <div class="sw"><div class="dot" style="background:#4FAB5A"></div><div><div class="name">Food</div><div class="hex">#4FAB5A</div></div></div>
  </div>
</body></html>
