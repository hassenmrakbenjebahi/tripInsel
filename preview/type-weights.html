<!doctype html>
<!-- @dsCard group="Type" name="Type · Weights" subtitle="Mulish 400 / 500 / 600 / 700 / 800" viewport="700x280" -->
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 24px; background: #fff; width: 700px; box-sizing: border-box; font-family: var(--font-primary); }
  .grid { display: grid; grid-template-columns: 56px 1fr 60px; gap: 12px 18px; align-items: baseline; }
  .w { font-size: 11px; color: #999; text-transform: uppercase; letter-spacing: 0.05em; }
  .sample { font-size: 28px; color: #161616; line-height: 1.1; }
  .label { font-size: 12px; color: #999; text-align: right; }
</style></head>
<body>
  <div class="grid">
    <div class="w">400</div><div class="sample" style="font-weight:400">Mulish — Regular body</div><div class="label">Body</div>
    <div class="w">500</div><div class="sample" style="font-weight:500">Mulish — Medium</div><div class="label">Emphasis</div>
    <div class="w">600</div><div class="sample" style="font-weight:600">Mulish — Semibold nav</div><div class="label">Nav · ghost</div>
    <div class="w">700</div><div class="sample" style="font-weight:700">Mulish — Bold titles</div><div class="label">Titles · btn</div>
    <div class="w">800</div><div class="sample" style="font-weight:800;letter-spacing:-0.015em">Mulish — Extrabold</div><div class="label">Hero · price</div>
  </div>
</body></html>
