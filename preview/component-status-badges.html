<!doctype html>
<!-- @dsCard group="Components" name="Components · Status badges" subtitle="Pill chips, 11 px uppercase" viewport="700x220" -->
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 28px 24px; background: #fff; width: 700px; box-sizing: border-box; font-family: var(--font-primary); }
  .row { display: flex; align-items: center; gap: 16px; padding: 8px 0; }
  .label { font: 600 12px var(--font-primary); color: #999; width: 130px; flex-shrink: 0; }
  .badge { font: 700 11px var(--font-primary); padding: 3px 10px; border-radius: 9999px; text-transform: uppercase; letter-spacing: 0.05em; }
</style></head>
<body>
  <div class="row"><span class="label">Confirmed</span><span class="badge" style="background:#D4F5E9;color:#00703A">Confirmed</span><span style="font:400 12px var(--font-primary);color:#999">Active booking, future date</span></div>
  <div class="row"><span class="label">Pending</span><span class="badge" style="background:#FEF3C7;color:#8A6000">Pending</span><span style="font:400 12px var(--font-primary);color:#999">Awaiting provider confirmation</span></div>
  <div class="row"><span class="label">Cancelled</span><span class="badge" style="background:#FDE8E8;color:#A30000">Cancelled</span><span style="font:400 12px var(--font-primary);color:#999">By tourist or provider</span></div>
  <div class="row"><span class="label">Completed</span><span class="badge" style="background:#F2F2F2;color:#555">Completed</span><span style="font:400 12px var(--font-primary);color:#999">Activity finished, eligible to review</span></div>
</body></html>
