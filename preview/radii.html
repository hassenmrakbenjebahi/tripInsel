<!doctype html>
<!-- @dsCard group="Spacing" name="Spacing · Radii" subtitle="4 / 8 / 12 / 16 / pill" viewport="700x200" -->
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 24px; background: #fff; width: 700px; box-sizing: border-box; font-family: var(--font-primary); }
  .row { display: grid; grid-template-columns: repeat(5, 1fr); gap: 14px; }
  .cell { display: flex; flex-direction: column; align-items: flex-start; gap: 10px; }
  .shape { width: 100%; height: 76px; background: #00AA6C; }
  .name { font: 700 12px var(--font-primary); color: #161616; }
  .px { font: 600 11px var(--font-primary); color: #999; margin-top: -6px; }
  .use { font: 400 11px/1.3 var(--font-primary); color: #999; }
</style></head>
<body>
  <div class="row">
    <div class="cell"><div class="shape" style="border-radius:4px"></div><div><div class="name">--radius-sm</div><div class="px">4 px</div><div class="use">Table cells, mini badges</div></div></div>
    <div class="cell"><div class="shape" style="border-radius:8px"></div><div><div class="name">--radius-md</div><div class="px">8 px</div><div class="use">Buttons, inputs, small cards</div></div></div>
    <div class="cell"><div class="shape" style="border-radius:12px"></div><div><div class="name">--radius-lg</div><div class="px">12 px</div><div class="use">Activity & list cards</div></div></div>
    <div class="cell"><div class="shape" style="border-radius:16px"></div><div><div class="name">--radius-xl</div><div class="px">16 px</div><div class="use">Modals, balance card</div></div></div>
    <div class="cell"><div class="shape" style="border-radius:9999px"></div><div><div class="name">--radius-full</div><div class="px">pill</div><div class="use">Chips, search, avatars</div></div></div>
  </div>
</body></html>
