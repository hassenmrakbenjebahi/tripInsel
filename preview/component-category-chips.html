<!doctype html>
<!-- @dsCard group="Components" name="Components · Category chips" subtitle="Filter pills + image-overlay variant" viewport="700x220" -->
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 28px 24px; background: #fff; width: 700px; box-sizing: border-box; font-family: var(--font-primary); }
  .label { font: 700 10px var(--font-primary); text-transform: uppercase; letter-spacing: 0.05em; color: #999; margin-bottom: 12px; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
  .chip { font: 600 13px var(--font-primary); padding: 8px 16px; border: 1px solid #DDD; border-radius: 9999px; background: #fff; color: #161616; cursor: pointer; display:inline-flex; align-items:center; gap:6px; }
  .chip:hover { background: #E8E8E8; }
  .chip.active { background: #E6F7F1; border-color: #00AA6C; color: #00703A; }
  .dot { width: 8px; height: 8px; border-radius: 9999px; display: inline-block; }
</style></head>
<body>
  <div class="label">Filter chips · default / hover / active</div>
  <div class="row">
    <span class="chip active">All</span>
    <span class="chip"><span class="dot" style="background:#C9853D"></span>Desert safari</span>
    <span class="chip"><span class="dot" style="background:#2E91D6"></span>Water sports</span>
    <span class="chip"><span class="dot" style="background:#5A4FCF"></span>Cultural</span>
    <span class="chip"><span class="dot" style="background:#E07A3B"></span>Cooking</span>
    <span class="chip"><span class="dot" style="background:#1FA7B8"></span>Diving</span>
    <span class="chip"><span class="dot" style="background:#00AA6C"></span>Boat tour</span>
    <span class="chip"><span class="dot" style="background:#8B5A3C"></span>Quad</span>
    <span class="chip"><span class="dot" style="background:#D66C8E"></span>Spa</span>
    <span class="chip"><span class="dot" style="background:#4FAB5A"></span>Food</span>
  </div>
  <div class="label">Category image-overlay badge</div>
  <div class="row">
    <span class="chip" style="background:rgba(255,255,255,0.95);border-color:transparent;font-size:11px;text-transform:uppercase;letter-spacing:0.04em;padding:5px 10px"><span class="dot" style="background:#C9853D"></span>Desert</span>
    <span class="chip" style="background:rgba(255,255,255,0.95);border-color:transparent;font-size:11px;text-transform:uppercase;letter-spacing:0.04em;padding:5px 10px"><span class="dot" style="background:#2E91D6"></span>Water</span>
    <span class="chip" style="background:rgba(255,255,255,0.95);border-color:transparent;font-size:11px;text-transform:uppercase;letter-spacing:0.04em;padding:5px 10px"><span class="dot" style="background:#5A4FCF"></span>Cultural</span>
  </div>
</body></html>
