<!doctype html>

<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 24px; background: #fff; width: 700px; box-sizing: border-box; font-family: var(--font-primary); }
  .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; }
  .photo { aspect-ratio: 16/10; border-radius: 12px; background-size: cover; background-position: center; position: relative; overflow: hidden; }
  .photo .vignette { position:absolute; inset:0; background: linear-gradient(180deg, transparent 40%, rgba(0,0,0,0.55) 100%); }
  .photo .caption { position:absolute; left:14px; bottom:12px; color:#fff; font:700 15px var(--font-primary); letter-spacing:-0.01em; }
  .photo .caption small { display: block; font: 400 11px var(--font-primary); opacity: 0.85; letter-spacing: 0; }
  .credit { margin-top: 10px; font: 400 11px var(--font-primary); color: #999; text-align: right; }
  .credit a { color: #555; text-decoration: none; }
</style></head>
<body>
  <div class="grid">
    <div class="photo" style="background-image:url(https://images.unsplash.com/flagged/photo-1555330596-bad55d96c09d?w=1200&amp;q=80&amp;fit=crop&amp;auto=format)"><div class="vignette"></div><div class="caption">Lagoon &amp; aerials<small>Cool · turquoise · Ras R'mel</small></div></div>
    <div class="photo" style="background-image:url(https://images.unsplash.com/photo-1627981699439-6b96f3b2b6cc?w=1200&amp;q=80&amp;fit=crop&amp;auto=format)"><div class="vignette"></div><div class="caption">Sunset on the strait<small>Warm · golden hour</small></div></div>
    <div class="photo" style="background-image:url(https://images.unsplash.com/photo-1627298628183-ab85392ea27b?w=1200&amp;q=80&amp;fit=crop&amp;auto=format)"><div class="vignette"></div><div class="caption">Beach &amp; umbrellas<small>Warm · Mediterranean shore</small></div></div>
    <div class="photo" style="background-image:url(https://images.unsplash.com/flagged/photo-1555330949-30bee6e79672?w=1200&amp;q=80&amp;fit=crop&amp;auto=format)"><div class="vignette"></div><div class="caption">Boats from above<small>Cool · the harbor</small></div></div>
