<!doctype html>
<!-- @dsCard group="Spacing" name="Spacing · Scale" subtitle="4 → 96 px linear ladder" viewport="700x360" -->
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 24px; background: #fff; width: 700px; box-sizing: border-box; font-family: var(--font-primary); }
  .row { display: flex; align-items: center; gap: 14px; padding: 6px 0; }
  .bar { background: #00AA6C; border-radius: 2px; height: 12px; }
  .tok { font: 600 12px var(--font-primary); color: #161616; width: 88px; flex-shrink: 0; }
  .val { font: 600 11px var(--font-primary); color: #999; margin-left: auto; flex-shrink: 0; }
</style></head>
<body>
  <div class="row"><div class="tok">--space-1</div><div class="bar" style="width:4px"></div><div class="val">4 px</div></div>
  <div class="row"><div class="tok">--space-2</div><div class="bar" style="width:8px"></div><div class="val">8 px</div></div>
  <div class="row"><div class="tok">--space-3</div><div class="bar" style="width:12px"></div><div class="val">12 px</div></div>
  <div class="row"><div class="tok">--space-4</div><div class="bar" style="width:16px"></div><div class="val">16 px</div></div>
  <div class="row"><div class="tok">--space-5</div><div class="bar" style="width:20px"></div><div class="val">20 px</div></div>
  <div class="row"><div class="tok">--space-6</div><div class="bar" style="width:24px"></div><div class="val">24 px</div></div>
  <div class="row"><div class="tok">--space-8</div><div class="bar" style="width:32px"></div><div class="val">32 px</div></div>
  <div class="row"><div class="tok">--space-10</div><div class="bar" style="width:40px"></div><div class="val">40 px</div></div>
  <div class="row"><div class="tok">--space-12</div><div class="bar" style="width:48px"></div><div class="val">48 px</div></div>
  <div class="row"><div class="tok">--space-16</div><div class="bar" style="width:64px"></div><div class="val">64 px</div></div>
  <div class="row"><div class="tok">--space-20</div><div class="bar" style="width:80px"></div><div class="val">80 px</div></div>
  <div class="row"><div class="tok">--space-24</div><div class="bar" style="width:96px"></div><div class="val">96 px</div></div>
</body></html>
