<!doctype html>
<!-- @dsCard group="Components" name="Components · Navbar" subtitle="Sticky white + 2-row nav links" viewport="700x140" -->
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 20px 24px; background: #F2F2F2; width: 700px; box-sizing: border-box; font-family: var(--font-primary); }
  .nav { background:#fff; border:1px solid #DDD; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.10); overflow: hidden; }
  .nav-row { display: flex; align-items: center; gap: 14px; padding: 12px 18px; border-bottom: 1px solid #F2F2F2; }
  .logo { font: 800 22px var(--font-primary); color: #00AA6C; letter-spacing: -0.02em; }
  .search { flex: 1; background: #F2F2F2; border-radius: 9999px; padding: 8px 14px 8px 38px; font: 400 13px var(--font-primary); color: #555; background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23555' stroke-width='2'><circle cx='11' cy='11' r='7'/><path d='m21 21-4.3-4.3'/></svg>"); background-repeat: no-repeat; background-position: 12px center; background-size: 16px 16px; }
  .signin { font: 700 13px var(--font-primary); color: #161616; padding: 8px 14px; cursor: pointer; }
  .nav-links { display: flex; gap: 22px; padding: 10px 18px; font: 600 13px var(--font-primary); color: #161616; }
  .nav-links a { color: #161616; padding: 4px 0; border-bottom: 2px solid transparent; }
  .nav-links a:hover { border-color: #00AA6C; text-decoration: none; }
  .nav-links a.active { color: #00AA6C; border-color: #00AA6C; }
</style></head>
<body>
  <div class="nav">
    <div class="nav-row">
      <span class="logo">TripInsel</span>
      <span class="search">Search activities, tours, experiences in Djerba…</span>
      <span class="signin">Sign in</span>
    </div>
    <div class="nav-links">
      <a class="active">Experiences</a>
      <a>Categories</a>
      <a>Map</a>
      <a>Reviews</a>
      <a>About Djerba</a>
    </div>
  </div>
</body></html>
