<!doctype html>
<!-- @dsCard group="Components" name="Components · Review card" subtitle="Avatar · bubbles · verified booking" viewport="700x240" -->
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 24px; background: #fff; width: 700px; box-sizing: border-box; font-family: var(--font-primary); }
  .review { padding: 6px 0; }
  .head { display: flex; align-items: center; gap: 12px; margin-bottom: 8px; }
  .avatar { width: 44px; height: 44px; border-radius: 9999px; background: #F2F2F2; display: flex; align-items: center; justify-content: center; font: 700 16px var(--font-primary); color: #555; flex-shrink: 0; }
  .who { font: 700 14px var(--font-primary); color: #161616; }
  .who-meta { font: 400 12px var(--font-primary); color: #999; }
  .rating { display: flex; align-items: center; gap: 6px; margin-bottom: 6px; }
  .bub { display:inline-flex; gap:2px; }
  .when { font: 400 12px var(--font-primary); color: #999; margin-left: auto; }
  .title { font: 700 15px var(--font-primary); color: #161616; margin: 0 0 4px; }
  .body { font: 400 14px/1.5 var(--font-primary); color: #161616; }
  .actions { display: flex; align-items: center; gap: 16px; margin-top: 10px; font: 400 12px var(--font-primary); color: #555; }
  .actions .helpful { display: inline-flex; align-items: center; gap: 5px; cursor: pointer; }
  .verified { display: inline-flex; align-items: center; gap: 4px; color: #555; }
</style></head>
<body>
  <div class="review">
    <div class="head">
      <div class="avatar">SK</div>
      <div style="flex:1">
        <div class="who">Sofia K.</div>
        <div class="who-meta">🇩🇪 Germany · Jun 2025</div>
      </div>
    </div>
    <div class="rating">
      <span class="bub">
        <svg width="14" height="14" viewBox="0 0 18 18"><circle cx="9" cy="9" r="8" fill="#00AA6C"/></svg>
        <svg width="14" height="14" viewBox="0 0 18 18"><circle cx="9" cy="9" r="8" fill="#00AA6C"/></svg>
        <svg width="14" height="14" viewBox="0 0 18 18"><circle cx="9" cy="9" r="8" fill="#00AA6C"/></svg>
        <svg width="14" height="14" viewBox="0 0 18 18"><circle cx="9" cy="9" r="8" fill="#00AA6C"/></svg>
        <svg width="14" height="14" viewBox="0 0 18 18"><circle cx="9" cy="9" r="8" fill="#00AA6C"/></svg>
      </span>
    </div>
    <h4 class="title">Amazing desert safari experience!</h4>
    <p class="body">The guide was incredibly knowledgeable and patient with our small kids. The sunset on the dunes was unforgettable — and the mint tea at the end was a lovely touch.</p>
    <div class="actions">
      <span class="helpful"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#555" stroke-width="2"><path d="M7 10v12"/><path d="M15 5.88 14 10h5.83a2 2 0 0 1 1.92 2.56l-2.33 8A2 2 0 0 1 17.5 22H7"/></svg> Helpful (12)</span>
      <span class="verified"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#00703A" stroke-width="2.5"><path d="M20 6 9 17l-5-5"/></svg> Verified booking</span>
    </div>
  </div>
</body></html>
