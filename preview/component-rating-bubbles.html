<!doctype html>
<!-- @dsCard group="Components" name="Components · Rating bubbles" subtitle="TripAdvisor green circles, never stars" viewport="700x260" -->
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 28px 24px; background: #fff; width: 700px; box-sizing: border-box; font-family: var(--font-primary); }
  .row { display: flex; align-items: center; gap: 14px; padding: 8px 0; }
  .label { font: 600 12px var(--font-primary); color: #999; width: 88px; flex-shrink: 0; }
  .bubbles { display: inline-flex; gap: 4px; }
  .score { font: 800 16px var(--font-primary); color: #161616; }
  .count { font: 400 13px var(--font-primary); color: #555; }
  svg.b { display: block; }
</style></head>
<body>
  <!-- 5.0 -->
  <div class="row"><span class="label">5.0</span>
    <span class="bubbles">
      <svg class="b" width="18" height="18" viewBox="0 0 18 18"><circle cx="9" cy="9" r="8" fill="#00AA6C"/></svg>
      <svg class="b" width="18" height="18" viewBox="0 0 18 18"><circle cx="9" cy="9" r="8" fill="#00AA6C"/></svg>
      <svg class="b" width="18" height="18" viewBox="0 0 18 18"><circle cx="9" cy="9" r="8" fill="#00AA6C"/></svg>
      <svg class="b" width="18" height="18" viewBox="0 0 18 18"><circle cx="9" cy="9" r="8" fill="#00AA6C"/></svg>
      <svg class="b" width="18" height="18" viewBox="0 0 18 18"><circle cx="9" cy="9" r="8" fill="#00AA6C"/></svg>
    </span>
    <span class="score">5.0</span><span class="count">· (2,041 reviews)</span>
  </div>
  <!-- 4.5 (half) -->
  <div class="row"><span class="label">4.5</span>
    <span class="bubbles">
      <svg class="b" width="18" height="18" viewBox="0 0 18 18"><circle cx="9" cy="9" r="8" fill="#00AA6C"/></svg>
      <svg class="b" width="18" height="18" viewBox="0 0 18 18"><circle cx="9" cy="9" r="8" fill="#00AA6C"/></svg>
      <svg class="b" width="18" height="18" viewBox="0 0 18 18"><circle cx="9" cy="9" r="8" fill="#00AA6C"/></svg>
      <svg class="b" width="18" height="18" viewBox="0 0 18 18"><circle cx="9" cy="9" r="8" fill="#00AA6C"/></svg>
      <svg class="b" width="18" height="18" viewBox="0 0 18 18">
        <defs><clipPath id="half"><rect x="0" y="0" width="9" height="18"/></clipPath></defs>
        <circle cx="9" cy="9" r="8" fill="#fff" stroke="#00AA6C" stroke-width="1.5"/>
        <circle cx="9" cy="9" r="8" fill="#00AA6C" clip-path="url(#half)"/>
      </svg>
    </span>
    <span class="score">4.5</span><span class="count">· (1,234 reviews)</span>
  </div>
  <!-- 4.0 -->
  <div class="row"><span class="label">4.0</span>
    <span class="bubbles">
      <svg class="b" width="18" height="18" viewBox="0 0 18 18"><circle cx="9" cy="9" r="8" fill="#00AA6C"/></svg>
      <svg class="b" width="18" height="18" viewBox="0 0 18 18"><circle cx="9" cy="9" r="8" fill="#00AA6C"/></svg>
      <svg class="b" width="18" height="18" viewBox="0 0 18 18"><circle cx="9" cy="9" r="8" fill="#00AA6C"/></svg>
      <svg class="b" width="18" height="18" viewBox="0 0 18 18"><circle cx="9" cy="9" r="8" fill="#00AA6C"/></svg>
      <svg class="b" width="18" height="18" viewBox="0 0 18 18"><circle cx="9" cy="9" r="8" fill="#fff" stroke="#00AA6C" stroke-width="1.5"/></svg>
    </span>
    <span class="score">4.0</span><span class="count">· (487 reviews)</span>
  </div>
  <!-- Size variants -->
  <div class="row" style="border-top:1px dashed #eee;padding-top:14px;margin-top:8px"><span class="label">sm · md · lg</span>
    <span class="bubbles">
      <svg width="12" height="12" viewBox="0 0 18 18"><circle cx="9" cy="9" r="8" fill="#00AA6C"/></svg>
      <svg width="12" height="12" viewBox="0 0 18 18"><circle cx="9" cy="9" r="8" fill="#00AA6C"/></svg>
      <svg width="12" height="12" viewBox="0 0 18 18"><circle cx="9" cy="9" r="8" fill="#00AA6C"/></svg>
      <svg width="12" height="12" viewBox="0 0 18 18"><circle cx="9" cy="9" r="8" fill="#00AA6C"/></svg>
      <svg width="12" height="12" viewBox="0 0 18 18"><circle cx="9" cy="9" r="8" fill="#00AA6C"/></svg>
    </span>
    <span class="bubbles">
      <svg width="18" height="18" viewBox="0 0 18 18"><circle cx="9" cy="9" r="8" fill="#00AA6C"/></svg>
      <svg width="18" height="18" viewBox="0 0 18 18"><circle cx="9" cy="9" r="8" fill="#00AA6C"/></svg>
      <svg width="18" height="18" viewBox="0 0 18 18"><circle cx="9" cy="9" r="8" fill="#00AA6C"/></svg>
      <svg width="18" height="18" viewBox="0 0 18 18"><circle cx="9" cy="9" r="8" fill="#00AA6C"/></svg>
      <svg width="18" height="18" viewBox="0 0 18 18"><circle cx="9" cy="9" r="8" fill="#00AA6C"/></svg>
    </span>
    <span class="bubbles">
      <svg width="26" height="26" viewBox="0 0 18 18"><circle cx="9" cy="9" r="8" fill="#00AA6C"/></svg>
      <svg width="26" height="26" viewBox="0 0 18 18"><circle cx="9" cy="9" r="8" fill="#00AA6C"/></svg>
      <svg width="26" height="26" viewBox="0 0 18 18"><circle cx="9" cy="9" r="8" fill="#00AA6C"/></svg>
      <svg width="26" height="26" viewBox="0 0 18 18"><circle cx="9" cy="9" r="8" fill="#00AA6C"/></svg>
      <svg width="26" height="26" viewBox="0 0 18 18"><circle cx="9" cy="9" r="8" fill="#00AA6C"/></svg>
    </span>
  </div>
</body></html>
