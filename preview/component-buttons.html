<!doctype html>
<!-- @dsCard group="Components" name="Components · Buttons" subtitle="Primary · secondary · ghost · sizes" viewport="700x320" -->
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 28px 24px; background: #fff; width: 700px; box-sizing: border-box; font-family: var(--font-primary); }
  .group { margin-bottom: 18px; }
  .group:last-child { margin-bottom: 0; }
  .label { font: 700 10px var(--font-primary); text-transform: uppercase; letter-spacing: 0.05em; color: #999; margin-bottom: 10px; }
  .row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  .btn { font: 700 14px var(--font-primary); border-radius: 8px; cursor: pointer; transition: background 0.15s ease; border: none; }
  .btn-primary { background: #00AA6C; color: #fff; padding: 10px 20px; }
  .btn-primary:hover { background: #007A4D; }
  .btn-primary.disabled { background: #00AA6C; opacity: 0.4; cursor: not-allowed; }
  .btn-secondary { background: transparent; color: #00AA6C; border: 1px solid #00AA6C; padding: 9px 19px; border-radius: 8px; font:700 14px var(--font-primary); }
  .btn-secondary:hover { background: #E6F7F1; }
  .btn-ghost { background: transparent; color: #161616; padding: 8px 12px; border-radius: 8px; font: 600 14px var(--font-primary); border:none; }
  .btn-ghost:hover { background: #E8E8E8; }
  .btn-sm { font-size: 12px; padding: 6px 12px; }
  .btn-lg { font-size: 16px; padding: 14px 28px; }
</style></head>
<body>
  <div class="group"><div class="label">Primary · rest / hover / disabled</div>
    <div class="row">
      <button class="btn btn-primary">Book on TripInsel</button>
      <button class="btn btn-primary" style="background:#007A4D">Hover state</button>
      <button class="btn btn-primary disabled">Disabled</button>
    </div>
  </div>
  <div class="group"><div class="label">Secondary outline</div>
    <div class="row">
      <button class="btn-secondary">Save</button>
      <button class="btn-secondary">Share</button>
    </div>
  </div>
  <div class="group"><div class="label">Ghost</div>
    <div class="row">
      <button class="btn-ghost">Sign in</button>
      <button class="btn-ghost">Cancel</button>
    </div>
  </div>
  <div class="group"><div class="label">Sizes</div>
    <div class="row">
      <button class="btn btn-primary btn-sm">Small</button>
      <button class="btn btn-primary">Default</button>
      <button class="btn btn-primary btn-lg">Large</button>
    </div>
  </div>
</body></html>
